<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب صرف أصناف - مخزن الكنيسة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="inventory-container">

        <header class="page-header">
            <h2>📋 استمارة طلب صرف أصناف</h2>
            <button class="back-btn" onclick="window.location.href='index.html'">➡️ العودة للرئيسية</button>
        </header>

        <div class="table-card" style="padding: 25px;">
            <form id="servantOrderForm">

                <div class="form-group">
                    <label for="servantName">اسم الخادم *</label>
                    <input type="text" id="servantName" required placeholder="أدخل اسمك بالكامل" class="form-control">
                </div>

                <div class="form-group">
                    <label for="activityName">اسم الفقرة / الخدمة *</label>
                    <input type="text" id="activityName" required placeholder="مثال: كورال / اجتماع شباب"
                        class="form-control">
                </div>

                <div class="form-group">
                    <label for="activityLeader">مسؤول الفقرة *</label>
                    <input type="text" id="activityLeader" required placeholder="اسم المسؤول عن الفقرة"
                        class="form-control">
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-color);">

                <h3 style="margin-bottom: 15px; font-size: 1.1rem;">📦 الأصناف المطلوبة</h3>

                <!-- منطقة اختيار الصنف والكمية -->
                <div style="display: flex; gap: 10px; align-items: flex-end; margin-bottom: 15px; flex-wrap: wrap;">
                    <div style="flex: 2; min-width: 180px;">
                        <label for="itemSelect" style="font-size:0.85rem; margin-bottom:4px; display:block;">اختر الصنف
                            *</label>
                        <select id="itemSelect" class="form-control"
                            style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color);">
                            <option value="">-- اختر الصنف --</option>
                        </select>
                    </div>

                    <div style="flex: 1; min-width: 100px;">
                        <label for="itemQty" style="font-size:0.85rem; margin-bottom:4px; display:block;">الكمية
                            *</label>
                        <input type="number" id="itemQty" min="1" placeholder="العدد" class="form-control">
                    </div>

                    <button type="button" class="btn btn-admin" style="width: auto; padding: 10px 20px;"
                        onclick="addToCart()">➕ إضافة صنف</button>
                </div>

                <!-- جدول عرض الأصناف المضافة بالسلة -->
                <table class="data-table" style="margin-bottom: 20px;">
                    <thead>
                        <tr>
                            <th>الصنف</th>
                            <th>الكمية المطلوبة</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <tr>
                            <td colspan="3" style="text-align:center;">لم يتم إضافة أي أصناف بعد.</td>
                        </tr>
                    </tbody>
                </table>

                <button type="submit" class="btn btn-servant"
                    style="width: 100%; padding: 12px; font-size: 1.1rem; background-color: #1e293b;">🚀 إرسال
                    الطلب</button>
            </form>
        </div>

    </main>

    <!-- ربط سكربت طلب الخدام -->
    <script src="servant-request.js"></script>
</body>

</html>
