<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الأدمن - مخزن الكنيسة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body style="display:flex; justify-content:center; align-items:center; min-height:100vh;">

    <div class="table-card" style="width: 100%; max-width: 420px; padding: 30px; text-align: center;">

        <div style="text-align: left; margin-bottom: 15px;">
            <button class="back-btn" onclick="window.location.href='index.html'">➡️ العودة للرئيسية</button>
        </div>

        <div style="margin-bottom: 20px;">
            <img src="logo.jpeg" alt="Logo" style="border-radius: 50%; width: 90px; height: 90px; object-fit: cover;">
        </div>

        <h2 style="margin-bottom: 5px;">دخول أمين المخزن</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 25px;">يرجى إدخال اسم المستخدم وكلمة المرور للوصول
            للنظام</p>

        <form id="loginForm">
            <div class="form-group" style="text-align: right; margin-bottom: 15px;">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" required placeholder="أدخل اسم المستخدم" class="form-control"
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color);">
            </div>

            <div class="form-group" style="text-align: right; margin-bottom: 20px;">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور" class="form-control"
                    style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color);">
            </div>

            <div id="errorMessage" class="hidden"
                style="display: none; color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem;">
                ❌ اسم المستخدم أو كلمة المرور غير صحيحة!
            </div>

            <button type="submit" id="submitBtn" class="btn btn-admin"
                style="width: 100%; padding: 12px; font-size: 1rem; background-color: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer;">🔓
                تسجيل الدخول</button>
        </form>
    </div>

    <!-- ربط كود الـ JS الخاص بنظام Google Sheets -->
    <script src="auth.js"></script>
</body>

</html>
