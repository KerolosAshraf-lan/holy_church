<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التالف والصيانة - مخزن الكنيسة</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="inventory-container">

        <!-- الهيدر -->
        <header class="page-header">
            <button class="back-btn" onclick="window.location.href='orders.html'">➡️ العودة للطلبات والمخزن</button>
            <h2>🔧 سجل الأصناف التالفة والصيانة</h2>
            <button class="btn btn-admin" style="width: auto; padding: 8px 16px;" onclick="openDamagedModal()">➕ تسجيل
                تالف</button>
        </header>

        <!-- جدول التالف -->
        <div class="table-card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>اسم الصنف</th>
                        <th>الكمية التالفة</th>
                        <th>سبب التلف / المشكلة</th>
                        <th>الإجراء / الحالة</th>
                        <th>التاريخ</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="damagedTableBody">
                    <!-- سيتم التحميل عبر JavaScript -->
                </tbody>
            </table>
        </div>

    </main>

    <!-- نافذة تسجيل تالف جديد (Modal) -->
    <div id="damagedModal" class="modal hidden">
        <div class="modal-content">
            <h3>تسجيل صنف تالف جديد</h3>
            <form id="damagedForm">

                <div class="form-group">
                    <label for="damagedItemSelect">اختر الصنف من المخزن *</label>
                    <select id="damagedItemSelect" required class="form-control">
                        <!-- يتم ملؤها ديناميكياً بالأصناف المتاحة -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="damagedQty">الكمية التالفة *</label>
                    <input type="number" id="damagedQty" min="1" required placeholder="أدخل الكمية">
                </div>

                <div class="form-group">
                    <label for="damagedReason">سبب التلف أو العطل *</label>
                    <input type="text" id="damagedReason" required placeholder="مثال: كسر في الشاشة / العطل بالسماعة">
                </div>

                <div class="form-group">
                    <label for="damagedStatus">الحالة الحالية *</label>
                    <select id="damagedStatus" required class="form-control">
                        <option value="under_repair">تحت الصيانة 🛠️</option>
                        <option value="scrapped">تخريد نهائي (غير قابل للإصلاح) ❌</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-admin">تسجيل وخصم من المخزن</button>
                    <button type="button" class="btn btn-servant" style="background:#64748b;"
                        onclick="closeDamagedModal()">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- استدعاء السكربت الخاص بإدارة التالف -->
    <script src="damaged.js"></script>
</body>

</html>
